name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Detecta qué parte del monorepo cambió. Un filtro `paths` a nivel de
  # workflow también apagaría el job del backend, por eso se filtra por job.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detectar cambios en Frontend/
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'Frontend/**'
              - '.github/workflows/ci.yml'

  android:
    name: android
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gradle 8.14 no corre sobre JDK 25; 17 es el que pide el proyecto (jvmTarget 17).
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle (con caché de dependencias)
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar (assembleDebug)
        run: ./gradlew assembleDebug --console=plain

      - name: Pruebas unitarias
        run: ./gradlew test --console=plain

      - name: Lint
        run: ./gradlew lint --console=plain

      - name: Publicar reportes de pruebas y lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reportes
          path: |
            Frontend/app/build/reports/
            Frontend/app/build/test-results/
          if-no-files-found: ignore

  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    env:
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DATABASE: upb_conecta
      MONGODB_TEST_DATABASE: upb_conecta_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Regla de dependencia hexagonal (RNF-41)
        run: npm run check:architecture

      - name: Tests (unitarios + integración contra MongoDB real) y cobertura (umbral 80%)
        run: npm run test:coverage

      - name: Auditoría de seguridad (dependencias de producción)
        run: npm audit --omit=dev --audit-level=high
