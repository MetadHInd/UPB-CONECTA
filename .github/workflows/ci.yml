name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Detecta qué parte del monorepo cambió. Un filtro `paths` a nivel de
  # workflow también apagaría el job del backend, por eso se filtra por job.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detectar cambios en Frontend/
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            frontend:
              - 'Frontend/**'
              - '.github/workflows/ci.yml'

  android:
    name: android
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Gradle 8.14 no corre sobre JDK 25; 17 es el que pide el proyecto (jvmTarget 17).
      - name: Setup JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle (con caché de dependencias)
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Compilar (assembleDebug)
        run: ./gradlew assembleDebug --console=plain

      - name: Pruebas unitarias
        run: ./gradlew test --console=plain

      - name: Lint
        run: ./gradlew lint --console=plain

      - name: Publicar reportes de pruebas y lint
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-reportes
          path: |
            Frontend/app/build/reports/
            Frontend/app/build/test-results/
          if-no-files-found: ignore

  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

      # Cache compartida (sesiones revocadas, limite de intentos de login): las
      # pruebas de sus adaptadores corren contra un Redis real, no un mock.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DATABASE: upb_conecta
      MONGODB_TEST_DATABASE: upb_conecta_test
      REDIS_TEST_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Regla de dependencia hexagonal (RNF-41)
        run: npm run check:architecture

      - name: Operaciones administrativas sin rol declarado (HU-46, RNF-18)
        run: npm run check:authorization

      - name: Tests (unitarios + integración contra MongoDB y Redis reales) y cobertura (umbral 80%)
        run: npm run test:coverage

      - name: Auditoría de seguridad (dependencias de producción)
        run: npm audit --omit=dev --audit-level=high
